<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 580" width="100%" height="580">
  <defs>
    <linearGradient id="ggBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a0d"/>
      <stop offset="50%" stop-color="#091817"/>
      <stop offset="100%" stop-color="#04090c"/>
    </linearGradient>

    <pattern id="ggGrid" width="25" height="25" patternUnits="userSpaceOnUse">
      <path d="M 25 0 L 0 0 0 25" fill="none" stroke="#134e4a" stroke-width="0.7" stroke-opacity="0.3"/>
    </pattern>

    <filter id="ggGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <marker id="arrowTeal" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#14b8a6"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#34d399"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="580" fill="url(#ggBg)"/>
  <rect width="1000" height="580" fill="url(#ggGrid)"/>

  <!-- Header -->
  <g transform="translate(40, 35)">
    <text font-family="'Fira Code', monospace" font-size="12" font-weight="700" fill="#14b8a6" letter-spacing="2">&gt; IOT_HARDWARE_TO_MOBILE :: SPECIFICATION</text>
    <text y="28" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" fill="#f8fafc">GrainGuardian — IoT Multi-Depth Sensor &amp; Android System Architecture</text>
    <text y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="500" fill="#94a3b8">Zero-Cloud Deterministic Agronomic Intelligence | BLE GATT Stream | Room SQLite</text>
  </g>

  <!-- Status Pill -->
  <g transform="translate(740, 35)">
    <rect width="220" height="32" rx="16" fill="#042f2e" stroke="#14b8a6" stroke-width="1" stroke-opacity="0.4"/>
    <circle cx="16" cy="16" r="4" fill="#34d399" filter="url(#ggGlow)"/>
    <text x="28" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#2dd4bf">BUILD VERIFIED ON-DEVICE</text>
  </g>

  <!-- 1. Hardware Multi-Depth Probe -->
  <g transform="translate(40, 110)">
    <rect width="260" height="420" rx="12" fill="#061a19" stroke="#0d9488" stroke-width="1.5"/>
    <rect width="260" height="32" rx="12" fill="#115e59"/>
    <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#99f6e4">1. PHYSICAL PROBE HARDWARE</text>

    <!-- Sensor 1: Moisture -->
    <rect x="16" y="48" width="228" height="60" rx="8" fill="#042f2e" stroke="#14b8a6" stroke-width="1"/>
    <text x="26" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#5eead4">SEN0193 Capacitive Moisture</text>
    <text x="26" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#99f6e4">Analog Voltage (0.5V - 3.0V)</text>

    <!-- Sensors 2,3,4: 3-Depth Temp -->
    <rect x="16" y="118" width="228" height="95" rx="8" fill="#042f2e" stroke="#14b8a6" stroke-width="1"/>
    <text x="26" y="138" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#5eead4">3x DS18B20 1-Wire Digital Temp</text>
    <text x="26" y="158" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ccfbf1">• Top Sensor (10 cm depth)</text>
    <text x="26" y="174" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ccfbf1">• Mid Sensor (40 cm depth)</text>
    <text x="26" y="190" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ccfbf1">• Bottom Sensor (80 cm depth)</text>

    <!-- Sensor 5: DHT22 -->
    <rect x="16" y="223" width="228" height="50" rx="8" fill="#042f2e" stroke="#14b8a6" stroke-width="1"/>
    <text x="26" y="243" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#5eead4">DHT22 Ambient Humidity / Temp</text>
    <text x="26" y="259" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#99f6e4">Digital GPIO Single Bus</text>

    <!-- ESP32 Controller Box -->
    <rect x="16" y="285" width="228" height="115" rx="8" fill="#0f172a" stroke="#00f0ff" stroke-width="1.5"/>
    <text x="26" y="308" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">ESP32 BLE GATT Microcontroller</text>
    <text x="26" y="328" font-family="'Fira Code', monospace" font-size="10.5" fill="#a5f3fc">SVC: 0x0000FFE0-0000-1000...</text>
    <text x="26" y="344" font-family="'Fira Code', monospace" font-size="10.5" fill="#a5f3fc">CHR: 0x0000FFE1-0000-1000...</text>
    <text x="26" y="364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#38bdf8">1 Hz ASCII Stream Format:</text>
    <text x="26" y="382" font-family="'Fira Code', monospace" font-size="10.5" fill="#34d399">M:&lt;%&gt;,T1:&lt;&gt;,T2:&lt;&gt;,T3:&lt;&gt;,H:&lt;&gt;</text>
  </g>

  <!-- 2. Android Client Engine Layer -->
  <g transform="translate(340, 110)">
    <rect width="320" height="420" rx="12" fill="#0a192f" stroke="#0284c7" stroke-width="1.5"/>
    <rect width="320" height="32" rx="12" fill="#0369a1"/>
    <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#e0f2fe">2. ANDROID CLIENT (BleManager)</text>

    <!-- Stabilization Gate -->
    <rect x="16" y="48" width="288" height="95" rx="8" fill="#082f49" stroke="#38bdf8" stroke-width="1"/>
    <text x="26" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">5-Packet Rolling Stability Gate</text>
    <text x="26" y="90" font-family="'Fira Code', monospace" font-size="11" fill="#7dd3fc">ΔM = max(M) - min(M) &lt; 0.25%</text>
    <text x="26" y="108" font-family="'Fira Code', monospace" font-size="11" fill="#7dd3fc">ΔT = max(T2) - min(T2) &lt; 0.35°C</text>
    <text x="26" y="128" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#34d399">✓ Prevents premature transient readings</text>

    <!-- Agronomic Decision Engine -->
    <rect x="16" y="153" width="288" height="135" rx="8" fill="#042f2e" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="26" y="175" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#2dd4bf">Deterministic Agronomic Engine</text>
    <text x="26" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ccfbf1">• Moisture Delta: ΔM = M - 13.5%</text>
    <text x="26" y="213" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ccfbf1">• Thermal Gradient: TGI = |T3 - T1|</text>
    <text x="26" y="231" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ccfbf1">• BDRS = 0.50•f(M) + 0.30•f(T2) + 0.20•f(TGI)</text>
    <text x="26" y="249" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ccfbf1">• Grain Health Index: GSHI = 100 - BDRS</text>
    <text x="26" y="271" font-family="'Fira Code', monospace" font-size="11" fill="#34d399">t_drying = max(0, round(ΔM * 2.5)) hrs</text>

    <!-- Room SQLite DB -->
    <rect x="16" y="298" width="288" height="105" rx="8" fill="#0f172a" stroke="#475569" stroke-width="1"/>
    <text x="26" y="320" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#f8fafc">Room SQLite Persistence (17 Fields)</text>
    <text x="26" y="340" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Table: `grain_inspections`</text>
    <text x="26" y="358" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Kotlin Coroutines Flow Queries (IO Dispatcher)</text>
    <text x="26" y="376" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#94a3b8">• Full Offline Auditability</text>
  </g>

  <!-- 3. Jetpack Compose UI Layer -->
  <g transform="translate(700, 110)">
    <rect width="260" height="420" rx="12" fill="#1a102f" stroke="#7c3aed" stroke-width="1.5"/>
    <rect width="260" height="32" rx="12" fill="#4c1d95"/>
    <text x="16" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#e9d5ff">3. JETPACK COMPOSE UI (18)</text>

    <rect x="16" y="48" width="228" height="85" rx="8" fill="#0f0728" stroke="#6d28d9" stroke-width="1"/>
    <text x="26" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#c084fc">Dual-Language Localization</text>
    <text x="26" y="90" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ddd6fe">• Telugu (తెలుగు) &amp; English</text>
    <text x="26" y="108" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#ddd6fe">• Instant Recomposition Engine</text>

    <rect x="16" y="145" width="228" height="150" rx="8" fill="#0f0728" stroke="#6d28d9" stroke-width="1"/>
    <text x="26" y="167" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#c084fc">18 Modular Screens</text>
    <text x="26" y="187" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#ddd6fe">• Dashboard &amp; Live Telemetry</text>
    <text x="26" y="203" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#ddd6fe">• Drying Readiness (Sun hours)</text>
    <text x="26" y="219" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#ddd6fe">• Storage Thermal Stratification</text>
    <text x="26" y="235" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#ddd6fe">• Biological Risk (BDRS) Matrix</text>
    <text x="26" y="251" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#ddd6fe">• Inspection History &amp; Details</text>
    <text x="26" y="267" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" fill="#ddd6fe">• Agronomic Knowledge Base</text>

    <rect x="16" y="305" width="228" height="95" rx="8" fill="#1e1b4b" stroke="#a78bfa" stroke-width="1"/>
    <text x="26" y="327" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#e9d5ff">Lab Developer Sandbox</text>
    <text x="26" y="347" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#c4b5fd">• Emulates probe hardware in lab</text>
    <text x="26" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#c4b5fd">• Explicit yellow safety banners</text>
    <text x="26" y="383" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" fill="#34d399">✓ Zero mock leakage in production</text>
  </g>

  <!-- Connectors -->
  <path d="M 300 320 L 340 320" fill="none" stroke="#14b8a6" stroke-width="2" marker-end="url(#arrowTeal)"/>
  <path d="M 660 320 L 700 320" fill="none" stroke="#34d399" stroke-width="2" marker-end="url(#arrowGreen)"/>
</svg>
